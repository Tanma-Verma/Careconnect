services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: careconnect-postgres
    environment:
      POSTGRES_USER: careconnect
      POSTGRES_PASSWORD: careconnect
      POSTGRES_DB: careconnect
    ports:
      - "5432:5432"
    volumes:
      - careconnect_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careconnect -d careconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: careconnect-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: careconnect
      MINIO_ROOT_PASSWORD: careconnect-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - careconnect_minio:/data

volumes:
  careconnect_pg:
  careconnect_minio:
